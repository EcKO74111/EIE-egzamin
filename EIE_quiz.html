<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EIE – quiz na kolokwium</title>
<style>
:root{--blue:#17357f;--blue2:#2e5bc4;--gold:#f0b400;--bg:#f3f6fc;--card:#fff;--ink:#1d2433;--mute:#5b6478;--line:#d9e0ef;--ok:#1a8f4a;--okbg:#e6f6ec;--bad:#c23b3b;--badbg:#fdeaea;--r:14px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 48px}
header.top{background:var(--blue);color:#fff;border-radius:0 0 var(--r) var(--r);padding:22px 18px 20px;position:relative;overflow:hidden}
header.top .in{max-width:760px;margin:0 auto}
header.top small{letter-spacing:.14em;text-transform:uppercase;color:#cfdcff;font-size:11px}
header.top h1{margin:4px 0 4px;font-size:26px;line-height:1.15}
header.top p{margin:0;color:#dfe8ff;font-size:14px}
.stars{position:absolute;right:14px;top:14px;width:64px;height:64px}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--blue);margin:26px 0 10px}
.grid{display:grid;gap:10px;grid-template-columns:1fr 1fr}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
button{font:inherit;cursor:pointer}
.mode{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:14px 14px;text-align:left;display:block;width:100%;color:var(--ink);transition:.15s}
.mode:hover,.mode:focus-visible{border-color:var(--blue2);box-shadow:0 2px 10px rgba(23,53,127,.12);outline:none}
.mode b{display:block;color:var(--blue);font-size:16px}
.mode span{font-size:13.5px;color:var(--mute)}
.mode.primary{background:var(--blue);border-color:var(--blue)}
.mode.primary b,.mode.primary span{color:#fff}
.mode[disabled]{opacity:.5;cursor:not-allowed}
.sec{display:flex;align-items:center;gap:12px}
.sec .tag{flex:none;width:40px;height:40px;border-radius:10px;background:var(--blue);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:15px}
.sec .txt{flex:1;min-width:0}
.sec .txt b{display:block;font-size:15px;color:var(--ink)}
.sec .txt span{font-size:12.5px;color:var(--mute)}
.bar{height:6px;background:#e4e9f5;border-radius:6px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--blue2);width:0}
.bar i.ok{background:var(--ok)}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:18px}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;font-size:13px;color:var(--mute)}
.pill{display:inline-block;background:#e9effc;color:var(--blue);border-radius:99px;padding:2px 10px;font-weight:700;font-size:12px}
.q{font-size:19px;line-height:1.4;font-weight:650;margin:6px 0 14px}
.opts{display:grid;gap:9px}
.opt{display:flex;gap:11px;align-items:flex-start;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;width:100%;color:var(--ink);transition:.12s}
.opt:hover:not([disabled]),.opt:focus-visible{border-color:var(--blue2);background:#f7f9ff;outline:none}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;background:#e9effc;color:var(--blue);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badbg)}.opt.bad .k{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.fb{margin-top:14px;border-radius:12px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--okbg);border-left:5px solid var(--ok)}.fb.bad{background:var(--badbg);border-left:5px solid var(--bad)}
.fb b{display:block;margin-bottom:2px}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:700;background:var(--blue);color:#fff}
.btn.sec2{background:#e9effc;color:var(--blue)}
.btn.gold{background:var(--gold);color:#241a00}
.btn.ghost{background:transparent;color:var(--mute);border:1.5px solid var(--line)}
.btn:hover{filter:brightness(1.07)}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
textarea{width:100%;min-height:90px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;resize:vertical}
.ans{background:#fff6d6;border-left:5px solid var(--gold);border-radius:12px;padding:12px 14px;margin-top:12px}
.ans b{display:block;color:#7a5600;font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px}
.score{text-align:center;padding:22px 10px}
.score .big{font-size:56px;font-weight:800;color:var(--blue);line-height:1}
.score .lbl{color:var(--mute);margin-top:4px}
.mis{border-top:1px solid var(--line);padding:12px 0}
.mis:first-child{border-top:0}
.mis small{color:var(--mute)}
.mis .good{color:var(--ok);font-weight:650}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.topbar .bar{flex:1;height:8px;margin:0}
.hint{font-size:12.5px;color:var(--mute);margin-top:12px}
.hide{display:none!important}
</style>
</head>
<body>
<header class="top"><div class="in">
<small>Uniwersytet Przyrodniczy w Poznaniu</small>
<h1>Ekonomia Integracji Europejskiej</h1>
<p>Quiz na kolokwium – sprawdź, czy znasz wszystkie 53 zagadnienia</p>
</div>
<svg class="stars" viewBox="0 0 64 64" aria-hidden="true"><g fill="#f0b400" id="st"></g></svg>
</header>
<div class="wrap" id="app"></div>
<script>
// Format: [sekcja, pytanie, [poprawna, zła1, zła2, zła3], wyjaśnienie]  — opcje są tasowane w quizie.
// Pytania otwarte: [sekcja, pytanie, null, wzorcowa odpowiedź]
const Q = [
// ===== A: Podstawy integracji (1–5) =====
['A','Czym jest integracja (w ujęciu ogólnym)?',['Procesem tworzenia całości, w którym państwa przekazują część kompetencji na poziom ponadnarodowy','Luźną współpracą państw, w której każde zachowuje pełną suwerenność','Wyłącznie umową handlową dwóch państw','Likwidacją wszystkich granic państwowych na świecie'],'Integracja = scalanie + oddanie części władzy + wspólne instytucje. Współpraca międzynarodowa jest luźniejsza.'],
['A','„Wartość dodana” z integracji („2 + 2 = 4,5”) oznacza, że:',['razem osiągamy więcej niż osobno','państwa tracą część dochodów','suma zasobów państw zawsze jest równa wynikowi integracji','integracja jest droższa niż współpraca'],'Powstaje nowa jakość – razem wychodzi więcej niż suma części.'],
['A','Czym integracja różni się od zwykłej współpracy międzynarodowej?',['Tworzy trwałe instytucje ponadnarodowe i wiążące prawo','Niczym – to synonimy','Dotyczy tylko handlu','Dotyczy wyłącznie państw sąsiadujących'],'W integracji są instytucje ponadnarodowe i wiążące prawo, we współpracy państwa zachowują pełną suwerenność.'],
['A','Które z poniższych NIE było przesłanką integracji europejskiej po II wojnie światowej?',['Chęć odzyskania przez państwa pełnej niezależności od siebie','Dążenie do trwałego pokoju w Europie','Odbudowa gospodarcza zniszczonej Europy','Bezpieczeństwo żywnościowe (głód po wojnie)'],'Integracja miała łączyć, nie rozdzielać – przesłanki to pokój, odbudowa, żywność, surowce, konkurencyjność wobec USA i ZSRR.'],
['A','Dlaczego integrację zaczęto od węgla i stali (EWWiS)?',['To surowce wojenne – wspólna kontrola uniemożliwia jednemu państwu potajemne zbrojenie','Bo były to jedyne surowce w Europie','Bo Wielka Brytania tego zażądała','Bo węgiel i stal były najdroższe na świecie'],'Wspólna kontrola produkcji surowców zbrojeniowych miała uczynić nową wojnę Francji i Niemiec niemożliwą.'],
['A','Którą datę obchodzimy jako Dzień Europy i z czym jest związana?',['9 maja – rocznica Deklaracji Schumana (1950)','1 maja – rocznica rozszerzenia z 2004 r.','25 marca – podpisanie traktatów rzymskich (1957)','1 listopada – wejście w życie traktatu z Maastricht'],'9 maja 1950 r. Robert Schuman ogłosił plan wspólnej kontroli węgla i stali.'],
['A','Główny cel integracji europejskiej w ujęciu gospodarczym to:',['Wspólny rynek wewnętrzny ze swobodnym przepływem towarów, usług, osób i kapitału','Wspólna armia i wspólna policja','Jednakowe podatki we wszystkich państwach','Likwidacja języków narodowych'],'Wspólny rynek w warunkach niezakłóconej konkurencji jest osią celów gospodarczych UE.'],
['A','Spójność (gospodarcza, społeczna, terytorialna) jako cel UE oznacza:',['zmniejszanie różnic w rozwoju między regionami i państwami','wyrównanie płac w całej UE co do euro','likwidację regionów','wspólne podatki dochodowe'],'Chodzi o harmonijny rozwój całej Unii – zmniejszanie różnic w poziomie rozwoju (art. 174 TFUE).'],
['A','Ojcowie założyciele to osoby, które:',['stworzyły pierwsze instytucje i były twórcami idei zjednoczonej Europy','były pierwszymi przewodniczącymi PE','podpisały Traktat z Lizbony','założyły NATO'],'Byli nie tylko politykami, ale też myślicielami idei integracji.'],
['A','Który z ojców założycieli ogłosił 9 maja 1950 r. plan wspólnej kontroli węgla i stali?',['Robert Schuman','Konrad Adenauer','Altiero Spinelli','Winston Churchill'],'Schuman był francuskim ministrem spraw zagranicznych – Deklaracja Schumana dała początek EWWiS.'],
['A','Kto był autorem koncepcji planu Schumana i pierwszym szefem Wysokiej Władzy EWWiS?',['Jean Monnet','Paul-Henri Spaak','Walter Hallstein','Alcide De Gasperi'],'Monnet: integracja „krok po kroku”, sektor po sektorze.'],
['A','Pierwszy kanclerz RFN, który dążył do pojednania z Francją, to:',['Konrad Adenauer','Johan Beyen','Joseph Bech','Sicco Mansholt'],'Adenauer – RFN w EWWiS, EWG, Euratomie; traktat o przyjaźni z de Gaulle’em w 1963 r.'],
['A','Altiero Spinelli był:',['federalistą, autorem projektu traktatu ustanawiającego UE (1984) i założycielem Klubu Krokodyla','pierwszym szefem Komisji EWG','premierem Belgii i twórcą Beneluksu','pierwszym kanclerzem RFN'],'Plan Spinellego był inspiracją m.in. dla Jednolitego Aktu Europejskiego.'],
['A','Kto w 1946 r. w Zurychu mówił o „Stanach Zjednoczonych Europy”?',['Winston Churchill','Robert Schuman','Jean Monnet','Alcide De Gasperi'],'Churchill proponował Radę Europy; Wielka Brytania miała wspierać, ale nie wchodzić do tej struktury.'],
['A','Paul-Henri Spaak jest kojarzony z:',['Beneluksem i „raportem Spaaka” – podstawą Traktatów rzymskich','Wspólną Polityką Rolną','Euro i Europejskim Bankiem Centralnym','Układem z Schengen'],'Spaak – Belg, współtwórca Beneluksu, przygotował raport do Traktatów rzymskich.'],
['A','Pomysłodawcą Wspólnej Polityki Rolnej był:',['Sicco Mansholt','Walter Hallstein','Johan Beyen','Joseph Bech'],'Holender Mansholt; WPR wystartowała w 1962 r.'],
['A','Pierwszym przewodniczącym Komisji EWG (1958–1967) był:',['Walter Hallstein','Jean Monnet','Konrad Adenauer','Paul-Henri Spaak'],'Hallstein – integracja gospodarcza ma iść szybko i obejmować wszystkie dziedziny.'],
['A','Alcide De Gasperi reprezentował:',['Włochy','Francję','Belgię','Holandię'],'Włoski premier, zwolennik planu Marshalla, EWWiS i EWG.'],
['A','Plan Beyena (Holandia) dotyczył głównie:',['wspólnego rynku','wspólnej armii','wspólnej waluty','wspólnych symboli'],'Beyen: Europa potrzebuje nie tylko integracji politycznej i wojskowej, ale wspólnego rynku.'],
['A','Kto napisał „O wiecznym pokoju” (1795) – jedną z wczesnych idei zjednoczonej Europy?',['Immanuel Kant','Victor Hugo','Richard Coudenhove-Kalergi','Aristide Briand'],'Kant – 1795; Coudenhove-Kalergi – Paneuropa (1923); Briand – projekt unii (1929).'],
['A','Jaka jest reguła integracji europejskiej?',['Najpierw partnerstwo gospodarcze, potem integracja polityczna','Najpierw wspólna armia, potem rynek','Najpierw wspólna waluta, potem handel','Wszystkie dziedziny jednocześnie'],'Najpierw portfel, potem władza: gospodarka → polityka (metoda małych kroków).'],
['A','Właściwa kolejność „małych kroków” w integracji europejskiej to:',['sektor (węgiel i stal) → rynek → waluta → polityka','waluta → rynek → sektor → polityka','polityka → obrona → rynek → waluta','rynek → polityka → sektor → waluta'],'Sukces w jednej dziedzinie pociąga następną.'],

// ===== B: Etapy i historia (6–9) =====
['B','Prawidłowa kolejność etapów integracji gospodarczej to:',['strefa wolnego handlu → unia celna → wspólny rynek → unia gospodarcza i walutowa → pełna integracja','unia celna → strefa wolnego handlu → wspólny rynek → unia walutowa → pełna integracja','wspólny rynek → strefa wolnego handlu → unia celna → unia walutowa → pełna integracja','unia walutowa → unia celna → strefa wolnego handlu → wspólny rynek → pełna integracja'],'Mnemonik S-U-W-U-P: Strefa, Unia celna, Wspólny rynek, Unia gospodarcza i walutowa, Pełna integracja.'],
['B','Na jakim etapie integracji wprowadza się wspólną taryfę celną wobec państw trzecich?',['Unia celna','Strefa wolnego handlu','Wspólny rynek','Pełna integracja ekonomiczna'],'W strefie wolnego handlu każde państwo samo ustala cła wobec reszty świata; w unii celnej obowiązuje wspólna taryfa.'],
['B','W strefie wolnego handlu:',['znosi się cła i ograniczenia ilościowe między członkami, ale każdy ustala własne cła wobec państw trzecich','obowiązuje wspólna waluta','obowiązuje wspólna taryfa celna','działają wspólne organy ponadnarodowe'],'Przykłady: EFTA, CEFTA.'],
['B','Swobodny przepływ towarów, usług, osób i kapitału charakteryzuje:',['wspólny rynek','strefę wolnego handlu','unię celną','każdy z tych etapów'],'Wspólny rynek = unia celna + swobody czynników produkcji.'],
['B','Harmonizacja polityk gospodarczych i wspólna waluta to cecha:',['unii gospodarczej i walutowej','unii celnej','strefy wolnego handlu','wspólnego rynku'],'W UE funkcjonuje ona w formie unii gospodarczej i walutowej (euro mają jeszcze nie wszystkie kraje).'],
['B','Na którym etapie integracji gospodarczej jest dziś UE?',['Unia gospodarcza i walutowa (etap 4)','Strefa wolnego handlu','Unia celna','Pełna integracja ekonomiczna'],'Do pełnej integracji (jak w federacji) UE brakuje m.in. wspólnej polityki fiskalnej.'],
['B','Który przykład to strefa wolnego handlu?',['EFTA','UE','Strefa euro','Stany Zjednoczone'],'EFTA, CEFTA, NAFTA/USMCA – strefy wolnego handlu.'],
['B','Poszerzanie integracji oznacza:',['włączanie nowych państw do ugrupowania','włączanie nowych dziedzin współpracy','zwiększanie budżetu','zmianę waluty'],'Poszerzanie = wszerz (ilu nas jest); pogłębianie = w głąb (co robimy razem).'],
['B','Pogłębianie integracji oznacza:',['włączanie nowych dziedzin życia i zacieśnianie współpracy','przyjmowanie nowych członków','wystąpienie państwa z UE','zniesienie traktatów'],'Przykłady: JAE (jednolity rynek), Maastricht (euro), Schengen.'],
['B','Który przykład to POSZERZANIE UE?',['Przyjęcie 10 państw 1 maja 2004 r.','Wprowadzenie euro','Podpisanie Jednolitego Aktu Europejskiego','Wprowadzenie wspólnej polityki rolnej'],'Kopenhaga 2002 → akcesja 10 państw (w tym Polski) w 2004 r.'],
['B','Który przykład to POGŁĘBIANIE UE?',['Traktat z Maastricht wprowadzający unię walutową','Przystąpienie Bułgarii i Rumunii','Przystąpienie Chorwacji','Akcesja Austrii, Finlandii i Szwecji'],'Maastricht dołożył nowe dziedziny: UGW, obywatelstwo UE, filary.'],
['B','Które Wspólnoty powstały jako pierwsze w kolejności?',['EWWiS, potem EWG i Euratom','EWG, potem EWWiS i Euratom','Euratom, potem EWWiS i EWG','Wszystkie trzy jednocześnie w 1950 r.'],'EWWiS (1951/52); EWG i Euratom (1957/58).'],
['B','Traktat paryski ustanawiający EWWiS podpisano w roku:',['1951','1957','1965','1950'],'1951 podpisany, w życie 1952; zawarty na 50 lat (wygasł w 2002 r.).'],
['B','Traktaty rzymskie (EWG i Euratom) podpisano w:',['1957 r.','1951 r.','1965 r.','1968 r.'],'Podpis 1957, wejście w życie 1.01.1958.'],
['B','Które Wspólnoty ustanowiły Traktaty rzymskie?',['EWG i Euratom','EWWiS i EWG','EWWiS i Euratom','EWG i EFTA'],'EWG – wspólny rynek; Euratom – energia jądrowa (zawarty bezterminowo).'],
['B','Który traktat/wspólnota został zawarty na 50 lat i wygasł w 2002 r.?',['EWWiS (traktat paryski)','EWG','Euratom','Traktat z Maastricht'],'EWWiS: w życie 1952 → wygasł 2002 (jej zadania przejęła UE).'],
['B','Co zmienił traktat fuzyjny (1965, w życie 1967)?',['Połączył organy trzech Wspólnot (jedna Komisja i jedna Rada)','Wprowadził euro','Zniósł cła wewnętrzne','Utworzył Parlament Europejski'],'Powstały Wspólnoty Europejskie z wspólnymi organami.'],
['B','Unia celna w EWG została zrealizowana w:',['1968 r.','1957 r.','1993 r.','1999 r.'],'1968 – zniesienie ceł wewnętrznych i wspólna taryfa celna.'],
['B','Wspólna Polityka Rolna (WPR) wystartowała w:',['1962 r.','1951 r.','1979 r.','1993 r.'],'Pomysłodawca: Sicco Mansholt.'],
['B','Europejski System Walutowy (ECU) powstał w:',['1979 r.','1968 r.','1993 r.','2002 r.'],'1979 – ESW i ECU, pierwsze bezpośrednie wybory do PE.'],
['B','Układ z Schengen podpisano w roku:',['1985','1979','1993','2004'],'Schengen = otwarte granice wewnętrzne.'],
['B','Jednolity Akt Europejski został podpisany w roku (wszedł w życie rok później):',['1986','1992','1979','1997'],'JAE: podpis 1986, w życie 1987; jednolity rynek zrealizowany od 1993.'],
['B','Który traktat powołał do życia Unię Europejską i wszedł w życie 1.11.1993 r.?',['Traktat z Maastricht','Traktat z Lizbony','Traktat nicejski','Traktat amsterdamski'],'Maastricht (podpis 1992): UE, 3 filary, obywatelstwo UE, droga do euro.'],
['B','Traktat z Lizbony wszedł w życie w:',['2009 r.','2007 r.','2004 r.','2001 r.'],'Podpisany 2007, w życie 1.12.2009 – obecna podstawa UE.'],
['B','Traktat amsterdamski wszedł w życie w:',['1999 r.','1997 r.','1993 r.','2003 r.'],'Podpis 1997, w życie 1999.'],
['B','Traktat nicejski (reformy przed rozszerzeniem) wszedł w życie w:',['2003 r.','2001 r.','1999 r.','2004 r.'],'Podpis 2001, w życie 2003.'],
['B','Traktat konstytucyjny (2004):',['nie wszedł w życie – odrzucony w referendach we Francji i Holandii (2005)','wszedł w życie w 2004 r.','zastąpił Traktat z Maastricht','został odrzucony przez Polskę'],'Zastąpił go Traktat z Lizbony.'],
['B','Euro w 1999 r. wprowadzono jako:',['walutę bezgotówkową (rozliczeniową); banknoty i monety – od 2002 r.','banknoty i monety w całej UE','waluta tylko dla Niemiec','waluta tylko dla państw założycielskich'],'III etap UGW – 1999; IV etap – 1.01.2002 banknoty i monety.'],
['B','Które państwa NIE były założycielami Wspólnot (1952/1957)?',['Dania i Irlandia','Belgia i Luksemburg','Francja i Włochy','Holandia i RFN'],'Założyciele (6): Francja, RFN, Włochy, Belgia, Holandia, Luksemburg.'],
['B','W 1973 r. do Wspólnot przystąpiły:',['Dania, Irlandia, Wielka Brytania','Grecja, Hiszpania, Portugalia','Austria, Finlandia, Szwecja','Cypr, Malta, Słowenia'],'Pierwsze rozszerzenie: 6 → 9 państw.'],

// ===== H: Pytania otwarte (repetytorium) =====
['H','Podaj przesłanki powstania koncepcji integracji europejskiej.',null,'Pokój i bezpieczeństwo („nigdy więcej wojny”), odbudowa gospodarcza po wojnie, bezpieczeństwo żywnościowe (głód), regulacja rynku surowców wojennych (węgiel i stal), konkurencyjność wobec USA i ZSRR. Mnemonik: Pokój – Odbudowa – Żywność – Surowce – Konkurencja.'],
['H','Wymień Wspólnoty w kolejności powstania i podaj, od kiedy istnieje UE.',null,'EWWiS (1951/52) → EWG i Euratom (1957/58) → Wspólnoty Europejskie (fuzja organów 1965/67). Unia Europejska od 1.11.1993 r. (traktat z Maastricht), dziś podstawa to Traktat z Lizbony (2009).'],
['H','Zinterpretuj motto UE „Jedność w różnorodności”.',null,'Państwa mimo różnic (języki, kultury, tradycje) współpracują dla wspólnych celów; wspólny rynek i interesy dają efektywność, innowacje i stabilność. Różnorodność to bogactwo i powód do szacunku i tolerancji, a nie bariera.'],
['H','Wyjaśnij pojęcia poszerzania i pogłębiania integracji i podaj po jednym przykładzie.',null,'Poszerzanie – włączanie nowych państw (np. 10 państw 1.05.2004 r., Kopenhaga 2002). Pogłębianie – włączanie nowych dziedzin (np. Maastricht – euro i unia gospodarcza i walutowa; JAE – jednolity rynek).'],
['H','Przedstaw etapy integracji gospodarczej i wskaż, gdzie jest UE.',null,'Strefa wolnego handlu → unia celna → wspólny rynek → unia gospodarcza i walutowa → pełna integracja ekonomiczna. UE jest na etapie unii gospodarczej i walutowej (część państw dopiero wprowadza euro).'],
['H','Uzupełnij: Z poziomu realizacji idei integracji gospodarczej wiodące jest wprowadzenie … rynku, wyrażanego swobodami …',null,'Jednolitego (wspólnego) rynku; swobodami: usług, towarów, osób, płatności i kapitału. Korzystanie z niektórych swobód jest uwarunkowane obywatelstwem UE (uzupełniającym wobec narodowego). Naczelną zasadą dla towarów jest brak ograniczeń przywozu i wywozu; wobec państw trzecich należy dopełnić formalności celnych.'],
['H','Omów dwa wymiary swobody osób (pracownicy, przedsiębiorczość).',null,'Pracownicy (art. 45 TFUE): prawo do szukania pracy, pobytu, równe traktowanie, zabezpieczenie społeczne; wyjątek – administracja publiczna. Przedsiębiorczość (art. 49 TFUE): zakładanie i prowadzenie firm, oddziałów w innym państwie na takich samych zasadach jak obywatele. Uznawanie kwalifikacji (nostryfikacja).'],
['H','Zdefiniuj optymalny obszar walutowy oraz podaj korzyści i koszty wejścia do unii walutowej.',null,'OOW – obszar, na którym korzyści ze wspólnej waluty (lub sztywnych kursów) są większe niż koszty (Mundell 1961). Korzyści: mniejsze ryzyko kursowe i koszty transakcyjne, niższe stopy, handel, inwestycje, wzrost PKB. Koszty: utrata autonomii polityki pieniężnej i kursowej, szoki asymetryczne, bezrobocie, wzrost cen przy zmianie, dumping socjalny, koszty techniczne.'],
['H','Czym jest polityka regionalna i jak wyjaśnić wymiary spójności na przykładach?',null,'Polityka regionalna (strukturalna) zmniejsza różnice rozwojowe między regionami. Wymiar społeczny: bezrobocie, wykształcenie → kursy, miejsca pracy. Gospodarczy: słaby sektor usług, niska konkurencyjność firm → innowacje, nowe linie produkcyjne. Przestrzenny: słabe drogi i dworce → modernizacje, ścieżki rowerowe.'],
['H','Czym jest perspektywa finansowa i jaka jest jej racjonalność?',null,'Wieloletni plan wydatków UE (np. 2021–2027) wyznaczający maksymalne kwoty. Racjonalność: bezpieczeństwo i przewidywalność realizacji, długoterminowe planowanie celów (inwestycje trwają latami), dyscyplina budżetowa.'],
['H','Jak wygląda proces aplikowania o środki UE na poziomie regionalnym i krajowym?',null,'Regionalny: 16 programów regionalnych, konkursy ogłasza zarząd województwa. Krajowy: programy krajowe (FEnIKS, FENG, FERS, FERC, FEPW) – projekty ogólnopolskie. Ścieżka: nabór → wniosek → ocena formalna i merytoryczna → umowa → realizacja → wnioski o płatność → kontrola i trwałość.'],
['H','Czy projekt wynika z potrzeby, czy z chęci pozyskania środków UE? Wskaż szanse i zagrożenia.',null,'Potrzeba – projekt odpowiada na realny problem, a fundusze pozwalają go zrealizować; chęć – projekt „pod konkurs”, dopasowany do kryteriów. Szanse: dofinansowanie, rozwój, kapitał ludzki. Zagrożenia: wkład własny, koszty utrzymania po projekcie, biurokracja, korekty finansowe.'],
['H','Wymień plusy i minusy aplikowania o środki UE.',null,'Plusy: realizacja idei bez pełnych środków własnych, wzrost konkurencyjności, rozwój kapitału ludzkiego, dodatkowe fundusze. Minusy: biurokracja, ryzyko nieotrzymania dofinansowania, projekt „pod pieniądze”, długi proces.'],
['H','Wymień kryteria konwergencji i podaj ich wartości.',null,'Inflacja ≤ 1,5 p.p. ponad średnią 3 najlepszych; deficyt ≤ 3% PKB; dług ≤ 60% PKB; kurs – ERM II ≥ 2 lata, wahania ±15%; długoterminowa stopa procentowa ≤ 2 p.p. ponad średnią 3 najlepszych. Mnemonik: 1,5 – 3 – 60 – 15 – 2.'],
['H','Wymień dochody budżetu UE i ich udziały.',null,'Zasoby własne (>90%): wpłaty oparte na DNB (~65%), VAT (~16%, stawka 0,3%), cła (~14%, państwa zatrzymują 25%), opłata od plastiku (~5%, 0,80 €/kg). Resztę stanowią dochody pozostałe (kary, podatki od wynagrodzeń itp.).'],
['H','Omów procedurę uchwalania rocznego budżetu UE.',null,'Komisja przedkłada projekt do 1 września → Rada przyjmuje stanowisko (do 1 października) → PE ma 42 dni → brak zgody: komitet pojednawczy (21 dni) → PE i Rada 14 dni na zatwierdzenie → budżet od 1 stycznia (art. 314 TFUE). WRF: jednomyślność Rady + zgoda PE.'],
['H','Wymień 9 zasad budżetu UE.',null,'Jedność, rzetelność budżetowa, jednoroczność, równowaga, jednostka rozliczeniowa (euro), uniwersalność, specyfikacja, należyte zarządzanie finansami, przejrzystość. Mnemonik: J-R-J-R-J-U-S-N-P.'],
];

const open_=Q.map((q,i)=>i).filter(i=>!Q[i][2]);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function st(i){return mem.stats[i]||(mem.stats[i]={ok:0,bad:0,last:null})}
function secIdx(s){return Q.map((q,i)=>i).filter(i=>Q[i][0]===s)}
function wrongList(){return Q.map((q,i)=>i).filter(i=>{const s=mem.stats[i];return s&&s.last===false})}
function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function home(){
  const all=Object.keys(mem.stats).length;
  const done=Q.map((q,i)=>i).filter(i=>mem.stats[i]&&mem.stats[i].last!==null).length;
  const okc=Q.map((q,i)=>i).filter(i=>mem.stats[i]&&mem.stats[i].last===true).length;
  const w=wrongList().length;
  let h=`<h2>Wybierz tryb</h2><div class="grid">
  <button class="mode primary" data-a="test"><b>Test losowy (30 pytań)</b><span>Jak na egzaminie: ABCD, wynik na końcu</span></button>
  <button class="mode" data-a="all"><b>Maraton – wszystkie ${mc.length} pytań</b><span>Wszystkie pytania zamknięte w losowej kolejności</span></button>
  <button class="mode" data-a="wrong" ${w?'':'disabled'}><b>Powtórka błędów${w?' ('+w+')':''}</b><span>Tylko pytania, na które ostatnio odpowiedziałeś źle</span></button>
  <button class="mode" data-a="open"><b>Pytania otwarte (${open_.length})</b><span>Odpowiedz własnymi słowami i porównaj z wzorem</span></button>
  </div>
  <div class="hint">${done?`Twój postęp: ${okc} z ${Q.length} pytań ostatnio poprawnie (${done} przerobionych).`:'Postęp zapisuje się w tej przeglądarce (jeśli jest to możliwe).'}</div>
  <h2>Nauka według działów</h2><div class="grid">`;
  SECTIONS.forEach(s=>{
    const ids=secIdx(s[0]);const okn=ids.filter(i=>mem.stats[i]&&mem.stats[i].last===true).length;
    h+=`<button class="mode" data-a="sec" data-s="${s[0]}"><div class="sec"><div class="tag">${s[0]}</div><div class="txt"><b>${s[1]}</b><span>${s[2]} · ${ids.length} pytań · ${okn} ✓</span><div class="bar"><i class="${okn===ids.length&&ids.length?'ok':''}" style="width:${ids.length?okn/ids.length*100:0}%"></i></div></div></div></button>`});
  h+=`</div>`;
  if(done){h+=`<div class="row"><button class="btn ghost" data-a="reset">Wyzeruj postęp</button></div>`}
  app.innerHTML=h;
  app.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>act(b.dataset.a,b.dataset.s));
  window.scrollTo(0,0);
}
function act(a,s){
  if(a==='test')return start(shuffle(mc).slice(0,Math.min(30,mc.length)),'Test losowy');
  if(a==='all')return start(shuffle(mc),'Maraton');
  if(a==='wrong')return start(shuffle(wrongList()),'Powtórka błędów');
  if(a==='open')return start(shuffle(open_),'Pytania otwarte');
  if(a==='sec'){const ids=secIdx(s);return start(shuffle(ids),SEC[s][1])}
  if(a==='reset'){mem={stats:{}};save();home()}
}
let run=null;
function start(ids,title){
  if(!ids.length){home();return}
  run={ids,title,pos:0,res:[],learn:false};
  show();
}
function show(){
  if(run.pos>=run.ids.length)return finish();
  const i=run.ids[run.pos],q=Q[i];
  const pct=run.pos/run.ids.length*100;
  let h=`<div class="topbar"><button class="btn ghost" id="quit" aria-label="Wyjdź">← Menu</button><div class="bar"><i style="width:${pct}%"></i></div><span style="font-size:13px;color:var(--mute)">${run.pos+1}/${run.ids.length}</span></div>
  <div class="card"><div class="qhead"><span class="pill">${SEC[q[0]][0]} · ${SEC[q[0]][1]}</span><span>${esc(run.title)}</span></div><div class="q">${esc(q[1])}</div>`;
  if(q[2]){
    run.opts=shuffle(q[2].map((t,k)=>({t,ok:k===0})));
    h+=`<div class="opts" id="opts">`+run.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="k">${LETTERS[k]}</span><span>${esc(o.t)}</span></button>`).join('')+`</div><div id="fb"></div><div class="row hide" id="nx"><button class="btn" id="next">${run.pos+1<run.ids.length?'Dalej →':'Zobacz wynik'}</button></div>`;
  }else{
    h+=`<textarea id="ta" placeholder="Wpisz swoją odpowiedź (opcjonalnie)…" aria-label="Twoja odpowiedź"></textarea><div class="row" id="rv"><button class="btn gold" id="reveal">Pokaż odpowiedź wzorcową</button></div><div id="fb"></div>`;
  }
  h+=`</div>`;
  app.innerHTML=h;window.scrollTo(0,0);
  $('#quit').onclick=()=>{if(run.res.length===0||confirm('Przerwać? Wynik tej sesji zostanie utracony.'))home()};
  if(q[2]){
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  }else{
    $('#reveal').onclick=()=>{
      $('#rv').classList.add('hide');
      $('#fb').innerHTML=`<div class="ans"><b>Wzorcowa odpowiedź</b>${esc(q[3])}</div><div class="hint">Czy Twoja odpowiedź zawierała najważniejsze elementy?</div><div class="row"><button class="btn" id="knew">Wiedziałem ✓</button><button class="btn sec2" id="notknew">Nie wiedziałem ✗</button></div>`;
      $('#knew').onclick=()=>rec(true);$('#notknew').onclick=()=>rec(false);
    };
  }
}
function answer(k){
  const i=run.ids[run.pos],q=Q[i];
  const good=run.opts[k].ok;
  app.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(run.opts[j].ok)b.classList.add('ok');else if(j===k)b.classList.add('bad')});
  $('#fb').innerHTML=`<div class="fb ${good?'ok':'bad'}"><b>${good?'Dobrze!':'Niestety nie.'}</b>${esc(q[3])}</div>`;
  $('#nx').classList.remove('hide');$('#next').focus();
  const s=st(i);if(good)s.ok++;else s.bad++;s.last=good;save();
  run.res.push({i,good,chosen:run.opts[k].t});
  $('#next').onclick=()=>{run.pos++;show()};
}
function rec(good){
  const i=run.ids[run.pos];const s=st(i);if(good)s.ok++;else s.bad++;s.last=good;save();
  run.res.push({i,good,chosen:null});run.pos++;show();
}
function finish(){
  const n=run.res.length,okn=run.res.filter(r=>r.good).length,pct=n?Math.round(okn/n*100):0;
  const by={};run.res.forEach(r=>{const s=Q[r.i][0];(by[s]=by[s]||{n:0,ok:0});by[s].n++;if(r.good)by[s].ok++});
  const bad=run.res.filter(r=>!r.good);
  let h=`<div class="card score"><div class="big">${pct}%</div><div class="lbl">${okn} z ${n} poprawnie · ${esc(run.title)}</div><div class="hint">${pct>=90?'Świetnie – jesteś gotowy!':pct>=70?'Dobrze – powtórz błędy i będzie komplet.':'Wróć do PDF-a przy działach z niskim wynikiem i spróbuj jeszcze raz.'}</div></div>
  <h2>Wynik według działów</h2><div class="card">`;
  SECTIONS.filter(s=>by[s[0]]).forEach(s=>{const b=by[s[0]];h+=`<div class="sec" style="margin:8px 0"><div class="tag">${s[0]}</div><div class="txt"><b>${s[1]}</b><span>${b.ok}/${b.n}</span><div class="bar"><i class="${b.ok===b.n?'ok':''}" style="width:${b.ok/b.n*100}%"></i></div></div></div>`});
  h+=`</div>`;
  if(bad.length){h+=`<h2>Do powtórki (${bad.length})</h2><div class="card">`+bad.map(r=>{const q=Q[r.i];return `<div class="mis"><small>${SEC[q[0]][0]} · ${SEC[q[0]][1]}</small><div><b>${esc(q[1])}</b></div>${q[2]?`${r.chosen?`<div style="color:var(--bad)">Twoja odpowiedź: ${esc(r.chosen)}</div>`:''}<div class="good">Poprawna: ${esc(q[2][0])}</div><div class="hint">${esc(q[3])}</div>`:`<div class="hint">${esc(q[3])}</div>`}</div>`}).join('')+`</div>`}
  h+=`<div class="row">${bad.length?'<button class="btn gold" id="again">Powtórz tylko błędy</button>':''}<button class="btn" id="menu">Menu</button></div>`;
  app.innerHTML=h;window.scrollTo(0,0);
  $('#menu').onclick=home;
  if(bad.length)$('#again').onclick=()=>start(shuffle(bad.map(r=>r.i)),'Powtórka błędów');
  run=null;
}
document.addEventListener('keydown',e=>{
  if(!run)return;
  const t=e.target&&e.target.tagName;if(t==='TEXTAREA')return;
  const opts=app.querySelectorAll('.opt');
  if(opts.length&&!opts[0].disabled){const k='1234'.indexOf(e.key);const k2='abcd'.indexOf(e.key.toLowerCase());const kk=k>=0?k:k2;if(kk>=0&&kk<opts.length){e.preventDefault();answer(kk)}}
  else if(e.key==='Enter'){const n=$('#next');if(n&&document.activeElement!==n){e.preventDefault();n.click()}}
});
home();
</script>
</body>
</html>
